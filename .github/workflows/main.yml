name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan file web
        run: |
          mkdir -p /tmp/www
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/www/
          rm -rf www && mv /tmp/www www
      - name: Buat project Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Game Master" com.tamaindo.gamemaster --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Game Master v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
