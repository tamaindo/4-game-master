<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Arcade 3D</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0e1220;color:#eef1fb;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:#fff;background:#26304d;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}

button:focus-visible{outline:2px solid #ffd166;outline-offset:2px}
#hub{max-width:920px;margin:0 auto;padding:40px 18px}
h1{font-size:clamp(28px,6vw,44px);letter-spacing:-.02em}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:#171d33;border:1px solid #28325a;border-radius:16px;padding:20px;text-align:left;display:block;width:100%}
.card:hover:not(.off){border-color:#ffd166;background:#1c2340}
.card .e{font-size:40px;line-height:1}

#stage{position:fixed;inset:0;display:none;background:#0e1220}
#gr{position:absolute;inset:0}
#gr canvas{display:block;width:100%;height:100%;touch-action:none}
#back{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:6}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:84px;right:12px;text-align:center;pointer-events:none}
#st{display:inline-block;background:#171d33dd;padding:9px 14px;border-radius:12px;font-weight:600;font-size:15px}
.bar{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1220d9;z-index:4}

.big{width:100%;margin-top:22px;background:#3ddc84;color:#05281a;font-weight:700;padding:13px}
.big:hover{background:#63e69d}
.joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:#ffffff1a;border:2px solid #ffffff44;touch-action:none;z-index:3}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#ffffff77;pointer-events:none}

.spd{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 2px 8px #000;font-size:14px}

.mp2{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:120px;height:120px;border-radius:8px;opacity:.92;pointer-events:none}
.ft{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#0b0f19cc;padding:6px 16px;border-radius:10px;pointer-events:none;font-variant-numeric:tabular-nums}

.kf{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font-size:13px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kf div{background:#0b0f19cc;padding:4px 8px;border-radius:6px}
.cx{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.cx i{position:absolute;background:#7dffb2;box-shadow:0 0 2px #000}
.cx i:nth-child(1){width:2px;height:9px;left:-1px;top:calc(-9px - var(--g,6px))}
.cx i:nth-child(2){width:2px;height:9px;left:-1px;top:var(--g,6px)}
.cx i:nth-child(3){height:2px;width:9px;top:-1px;left:calc(-9px - var(--g,6px))}
.cx i:nth-child(4){height:2px;width:9px;top:-1px;left:var(--g,6px)}
.cx u{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:#7dffb2}
.hm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 6px #000}
.ov2{position:absolute;inset:0;pointer-events:none;opacity:0}
.vg{box-shadow:inset 0 0 120px 40px #f00}.fl{background:#fff}
.scp{background:radial-gradient(circle closest-side,transparent 0,transparent 82%,#000 83%)}
.hp{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;align-items:baseline;font-size:15px;text-shadow:0 2px 6px #000;pointer-events:none}
.hp b{font-size:34px}
.am{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:right;text-shadow:0 2px 6px #000;pointer-events:none}
.am b{font-size:40px}.am small{display:block;opacity:.85}
.ab{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:10px;font-size:13px;pointer-events:none}
.ab span{background:#0b0f19cc;padding:5px 10px;border-radius:8px}
.bn2{position:absolute;top:20%;left:0;right:0;text-align:center;font-size:clamp(22px,5vw,42px);font-weight:800;text-shadow:0 4px 18px #000;pointer-events:none}
.us{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:200px;height:10px;background:#0008;border-radius:5px;display:none;pointer-events:none}
.us i{display:block;height:100%;width:0;background:#ffd166;border-radius:5px}
.hint{position:absolute;left:50%;top:68%;transform:translateX(-50%);font-size:14px;text-shadow:0 2px 6px #000;pointer-events:none;text-align:center;white-space:nowrap}
.buy{z-index:5}.buy .pn{width:min(94vw,560px);max-height:90vh;overflow:auto}
.bg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.bg button{text-align:left;padding:10px}.bg button small{display:block;opacity:.7}.bg button:disabled{opacity:.4}
.sbd{z-index:5;background:#0b0f19e6;font-size:14px}.sbd table{border-collapse:collapse;width:100%}.sbd td,.sbd th{padding:3px 10px;text-align:left}
.tb{position:absolute;width:60px;height:60px;border-radius:50%;background:#ffffff2e;border:2px solid #ffffff55;font-size:19px;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;z-index:3}
.tb:active{background:#ffd166aa}
.tf{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:84px;height:84px;font-size:28px}
.tjp{right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.trl{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.tad{right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.tcr{right:calc(190px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.tus{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.tsw{right:calc(10px + env(safe-area-inset-right,0px));top:calc(150px + env(safe-area-inset-top,0px));width:48px;height:48px}
.tbuy{left:calc(10px + env(safe-area-inset-left,0px));top:calc(140px + env(safe-area-inset-top,0px));width:48px;height:48px}
.tq1{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
.tq2{left:calc(76px + env(safe-area-inset-left,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
#gr canvas.rd{width:128px;height:80px}
#gr canvas.mp2{width:120px;height:120px}
#gr canvas.rd.off,#gr canvas.mp2.off{display:none}
@media (hover:hover) and (pointer:fine){.joy,.act,.str,.pw.sm{display:none}}
@media (pointer:coarse){
.act{width:128px}.act button{width:58px;height:58px;background:#ffffff1c;border-color:#ffffff30}
.joy{width:110px;height:110px;background:#ffffff12;border-color:#ffffff30}.joy i{width:48px;height:48px;margin:-24px}
.str button{width:70px;height:70px;background:#ffffff1c;border-color:#ffffff30}
.tb{background:#ffffff1c;border-color:#ffffff30}}
</style>

<body>
<div id="hub">
  <h1>Game Arcade 3D</h1>
  <p class="sub">Pilih game. Semuanya jalan langsung di browser.</p>
  <div class="grid">
    <button class="card" data-g="chess"><div class="e">♞</div><h3>Catur 3D</h3><p>Lawan bot (3 level) atau lawan teman di satu perangkat.</p></button>
    <button class="card" data-g="soccer"><div class="e">⚽</div><h3>Bola 11 vs 11</h3><p>Gaya FIFA: offside, foul, penalti, tendangan sudut, 2 babak.</p></button>
    <button class="card" data-g="f1"><div class="e">🏎️</div><h3>F1 Mobile</h3><p>Balap 3D lawan 5 rival, lampu start, lap, dan boost.</p></button>
    <button class="card" data-g="fps"><div class="e">🎯</div><h3>FPS Taktis</h3><p>5 vs 5 ala Valorant: spike, beli senjata, smoke &amp; flash.</p></button>
  </div>
</div>

<div id="stage"><button id="back">← Menu</button><div id="gr"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= HUB ================= */
const GAMES={chess:startChess,soccer:startSoccer,f1:startF1,fps:startFPS};
let dispose=null;
const hub=document.getElementById('hub'),stage=document.getElementById('stage'),gr=document.getElementById('gr');
document.querySelectorAll('.card[data-g]').forEach(c=>c.onclick=()=>{
  hub.style.display='none';stage.style.display='block';
  dispose=GAMES[c.dataset.g](gr);
});
document.getElementById('back').onclick=()=>{
  if(dispose)dispose();dispose=null;
  stage.style.display='none';hub.style.display='block';
};

/* ================= GAME 1: CATUR 3D ================= */
function startChess(root){
  /* ---------- mesin catur ---------- */
  const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
  const DG=[[1,1],[1,-1],[-1,1],[-1,-1]],OR=[[1,0],[-1,0],[0,1],[0,-1]],KG=DG.concat(OR);
  const VAL={P:100,N:320,B:330,R:500,Q:900,K:0};
  const RM={0:'Q',7:'K',4:'KQ',56:'q',63:'k',60:'kq'};
  const col=c=>c===c.toUpperCase()?'w':'b';

  function att(b,sq,by){
    const r=sq>>3,f=sq&7,up=by==='w',pr=up?r-1:r+1;
    const g=(rr,ff)=>rr>=0&&rr<8&&ff>=0&&ff<8?b[rr*8+ff]:'x';
    const X=ch=>up?ch:ch.toLowerCase();
    for(const d of[-1,1])if(g(pr,f+d)===X('P'))return true;
    for(const[a,c]of KN)if(g(r+a,f+c)===X('N'))return true;
    for(const[a,c]of KG)if(g(r+a,f+c)===X('K'))return true;
    for(const[dirs,t]of[[DG,'B'],[OR,'R']])for(const[a,c]of dirs){
      let rr=r+a,ff=f+c;
      while(rr>=0&&rr<8&&ff>=0&&ff<8){const q=b[rr*8+ff];if(q){if(q===X(t)||q===X('Q'))return true;break}rr+=a;ff+=c}
    }
    return false;
  }
  function mk(s,m){
    const b=s.b.slice(),me=s.t,p=b[m.f];let cr=s.cr,ep=-1;
    b[m.t]=m.pr?(me==='w'?m.pr:m.pr.toLowerCase()):p;b[m.f]='';
    if(m.e)b[m.t+(me==='w'?-8:8)]='';
    if(m.dp)ep=(m.f+m.t)/2;
    if(m.c){const bs=me==='w'?0:56;if(m.c===1){b[bs+5]=b[bs+7];b[bs+7]=''}else{b[bs+3]=b[bs];b[bs]=''}}
    for(const q of[m.f,m.t]){const x=RM[q];if(x)for(const ch of x)cr=cr.replace(ch,'')}
    return{b,t:me==='w'?'b':'w',cr,ep};
  }
  function gen(s){
    const{b,t:me,cr,ep}=s,out=[],en=me==='w'?'b':'w';
    for(let i=0;i<64;i++){
      const p=b[i];if(!p||col(p)!==me)continue;
      const r=i>>3,f=i&7,u=p.toUpperCase();
      if(u==='P'){
        const d=me==='w'?1:-1,sr=me==='w'?1:6,pr=me==='w'?7:0,r1=r+d;
        const add=(to,x)=>{if(to>>3===pr){for(const q of'QRBN')out.push({f:i,t:to,pr:q})}else out.push({f:i,t:to,...x})};
        if(r1>=0&&r1<8&&!b[r1*8+f]){
          add(r1*8+f,{});
          if(r===sr&&!b[(r+2*d)*8+f])out.push({f:i,t:(r+2*d)*8+f,dp:1});
        }
        for(const df of[-1,1]){
          const ff=f+df;if(ff<0||ff>7||r1<0||r1>7)continue;
          const to=r1*8+ff,q=b[to];
          if(q&&col(q)!==me)add(to,{});else if(!q&&to===ep)out.push({f:i,t:to,e:1});
        }
      }else if(u==='N'||u==='K'){
        for(const[dr,df]of u==='N'?KN:KG){
          const rr=r+dr,ff=f+df;if(rr<0||rr>7||ff<0||ff>7)continue;
          const q=b[rr*8+ff];if(!q||col(q)!==me)out.push({f:i,t:rr*8+ff});
        }
        if(u==='K'&&i===(me==='w'?4:60)){
          const bs=me==='w'?0:56,R=me==='w'?'R':'r';
          if(cr.includes(me==='w'?'K':'k')&&!b[bs+5]&&!b[bs+6]&&b[bs+7]===R&&!att(b,bs+4,en)&&!att(b,bs+5,en)&&!att(b,bs+6,en))out.push({f:i,t:bs+6,c:1});
          if(cr.includes(me==='w'?'Q':'q')&&!b[bs+1]&&!b[bs+2]&&!b[bs+3]&&b[bs]===R&&!att(b,bs+4,en)&&!att(b,bs+3,en)&&!att(b,bs+2,en))out.push({f:i,t:bs+2,c:2});
        }
      }else{
        for(const[dr,df]of u==='B'?DG:u==='R'?OR:KG){
          let rr=r+dr,ff=f+df;
          while(rr>=0&&rr<8&&ff>=0&&ff<8){
            const to=rr*8+ff,q=b[to];
            if(!q)out.push({f:i,t:to});else{if(col(q)!==me)out.push({f:i,t:to});break}
            rr+=dr;ff+=df;
          }
        }
      }
    }
    const K=me==='w'?'K':'k';
    return out.filter(m=>{const n=mk(s,m);return!att(n.b,n.b.indexOf(K),en)});
  }
  const inChk=s=>att(s.b,s.b.indexOf(s.t==='w'?'K':'k'),s.t==='w'?'b':'w');

  /* ---------- bot ---------- */
  function ev(b){
    let s=0;
    for(let i=0;i<64;i++){
      const p=b[i];if(!p)continue;
      const u=p.toUpperCase(),w=p===u,r=i>>3,f=i&7;let v=VAL[u];
      const cd=6-Math.abs(r-3.5)-Math.abs(f-3.5);
      if(u==='P')v+=(w?r:7-r)*6+cd*2;else if(u!=='K'&&u!=='R')v+=cd*4;
      s+=w?v:-v;
    }
    return s;
  }
  function order(s,ms){
    for(const m of ms){const c=s.b[m.t];m.o=(c?VAL[c.toUpperCase()]*10-VAL[s.b[m.f].toUpperCase()]:0)+(m.pr?800:0)}
    return ms.sort((a,b)=>b.o-a.o);
  }
  function srch(s,d,a,b){
    const ms=gen(s);
    if(!ms.length)return inChk(s)?-99000-d:0;
    if(!d)return(s.t==='w'?1:-1)*ev(s.b);
    for(const m of order(s,ms)){
      const v=-srch(mk(s,m),d-1,-b,-a);
      if(v>=b)return b;if(v>a)a=v;
    }
    return a;
  }
  function best(s,lvl){
    const ms=gen(s);
    for(let i=ms.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ms[i],ms[j]]=[ms[j],ms[i]]}
    order(s,ms);
    let bm=null,a=-Infinity;
    for(const m of ms){
      const v=-srch(mk(s,m),lvl-1,-Infinity,lvl>1?-a:Infinity)+(lvl===1?Math.random()*140:0);
      if(v>a||!bm){a=v;bm=m}
    }
    return bm;
  }

  /* ---------- UI ---------- */
  root.innerHTML=`<div class="top"><span id="st">Catur 3D</span></div>
  <div class="bar"><button id="un">↶ Undo</button><button id="fl">⟲ Putar papan</button><button id="nw">Game baru</button></div>
  <div id="mn" class="ov"><div class="pn"><h2>♞ Catur 3D</h2>
  <p>Mode</p><div class="seg" data-k="mode"><button class="on" data-v="bot">Lawan bot</button><button data-v="friend">Lawan teman</button></div>
  <div id="bo"><p>Kamu main sebagai</p><div class="seg" data-k="side"><button class="on" data-v="w">Putih</button><button data-v="b">Hitam</button><button data-v="r">Acak</button></div>
  <p>Level bot</p><div class="seg" data-k="lvl"><button data-v="1">Mudah</button><button class="on" data-v="2">Sedang</button><button data-v="3">Sulit</button></div></div>
  <button id="go" class="big">Mulai main</button></div></div>`;
  const $=id=>root.querySelector('#'+id),stEl=$('st'),mn=$('mn');
  const cfg={mode:'bot',side:'w',lvl:'2'};
  root.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    sg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    cfg[sg.dataset.k]=b.dataset.v;$('bo').style.display=cfg.mode==='bot'?'':'none';
  }));

  /* ---------- 3D ---------- */
  const R=new THREE.WebGLRenderer({antialias:true});

      if(!u.alive)continue;
      if(u.isP&&!u.auto)playerStep(u,dt);else think(u,dt);
    }
    for(let a=0;a<10;a++)for(let b=a+1;b<10;b++){
      const A=U[a],B=U[b];if(!A.alive||!B.alive)continue;
      const dx=B.x-A.x,dz=B.z-A.z,d2=dx*dx+dz*dz;
      if(d2<.5&&d2>1e-4&&Math.abs(A.y-B.y)<1.2){const d=Math.sqrt(d2),k=(.7-d)/2/d;A.x-=dx*k;A.z-=dz*k;B.x+=dx*k;B.z+=dz*k}
    }
    if(st==='buy')for(const u of U){const side=u.team===atkT?0:1,x1=side===0?-41:30,x2=side===0?-28:41;u.x=clamp(u.x,x1,x2);u.z=clamp(u.z,-9,9)}
    stepG(dt);playerSight(dt);
  }
  let prev=performance.now(),raf;
  function loop(now){
    raf=requestAnimationFrame(loop);
    const dt=Math.max(0,Math.min(.05,(now-prev)/1000||0));prev=now;
    step(dt);render(dt);hud(dt);
  }
  for(const u of U){resetKit(u);u.acc=1}
  newRound();st='menu';
  loop(performance.now());
  el.mn.style.display='flex';
  return()=>{ac0.abort();cancelAnimationFrame(raf);try{document.exitPointerLock()}catch(e){}try{ac&&ac.close()}catch(e){}R.dispose();root.innerHTML=''};
}

</script>
